<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Nebraska</title>
<style>
  :root{ --naranja:#F5891C; --negro:#1A1A1A; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#eee;
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  .wrap{ width:100%; max-width:420px; }
  h1{
    font-size:22px;
    color:var(--negro);
    text-align:center;
    margin-bottom:18px;
  }
  .cat-btn{
    display:block;
    width:100%;
    background:#fff;
    border:2px solid var(--naranja);
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
    font-size:17px;
    font-weight:bold;
    color:var(--negro);
    text-decoration:none;
    text-align:center;
  }
  .estado{ text-align:center; font-size:13px; color:#a00; padding:40px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Catálogo Nebraska</h1>
  <div id="categorias">
    <div class="estado">Cargando categorías…</div>
  </div><a class="cat-btn" href="https://drive.google.com/file/d/1a0Gi2UGH8Bv5koPII8cMGI0ezpHFYTLi/view?usp=drive_link" target="_blank" style="background:#1A1A1A; color:#fff; border-color:#1A1A1A;">📄 Ver catálogo completo (PDF)</a>
</div>

<script>
fetch(`fichas/manifest.json?t=${Date.now()}`)
  .then(r => r.json())
  .then(data => {
    const cont = document.getElementById("categorias");
    cont.innerHTML = "";
    Object.keys(data.categorias).forEach(key => {
      const cat = data.categorias[key];
      const a = document.createElement("a");
      a.className = "cat-btn";
      a.href = `categoria.html?cat=${key}`;
      a.textContent = cat.nombre;
      cont.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById("categorias").innerHTML =
      '<div class="estado">No se pudo cargar el catálogo</div>';
  });
</script>
</body>
</html>
