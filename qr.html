<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d1d1d">
<meta name="robots" content="noindex">
<title>Generador de QR — Nebraska</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
<link rel="stylesheet" href="assets/nebraska.css">
<style>
  /* ---- panel de opciones ---- */
  .qr-panel{
    background:#fff; border:1px solid var(--linea); border-radius:var(--radio);
    box-shadow:var(--sombra); padding:16px; margin-bottom:20px;
  }
  .qr-fila{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .qr-campo{ flex:1 1 220px; min-width:0; }
  .qr-campo label{
    display:block; font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--suave); margin-bottom:6px;
  }
  .qr-campo input, .qr-campo select{
    width:100%; height:42px; padding:0 12px;
    border:1.5px solid #dcdce1; border-radius:10px;
    font-family:inherit; font-size:14px; color:var(--negro); background:#fff;
  }
  .qr-campo input:focus, .qr-campo select:focus{ outline:0; border-color:var(--naranja); }
  .qr-aviso{ font-size:12.5px; color:var(--suave); margin-top:12px; line-height:1.5; }
  .qr-aviso b{ color:var(--negro); }

  /* ---- grilla de etiquetas ---- */
  .qr-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  .qr-item{
    background:#fff; border:1px solid var(--linea); border-radius:10px;
    padding:10px; text-align:center; width:var(--etiqueta, 150px);
  }
  .qr-item canvas{ width:100%; height:auto; display:block; image-rendering:pixelated; }
  .qr-item .cod{ font-size:11px; font-weight:800; letter-spacing:.03em; margin-top:6px; word-break:break-all; }
  .qr-item .cat{ font-size:9.5px; color:var(--suave); margin-top:2px; }
  .qr-item .bajar{
    display:inline-block; margin-top:6px; font-size:10px; font-weight:700;
    color:var(--naranja-osc); text-decoration:none; cursor:pointer;
  }

  /* ---- impresión: solo las etiquetas, sin nada del sitio ---- */
  @media print{
    @page{ margin:10mm; }
    body{ background:#fff; }
    .nb-header, .qr-panel, .nb-pie, .qr-noprint{ display:none !important; }
    .nb-wrap{ padding:0; max-width:none; }
    .qr-grid{ gap:4mm; }
    .qr-item{
      border:1px dashed #bbb; border-radius:0; padding:3mm;
      break-inside:avoid; page-break-inside:avoid;
    }
    .qr-item .bajar{ display:none; }
  }
</style>
</head>
<body>

<header class="nb-header qr-noprint">
  <div class="nb-bar">
    <a class="nb-logo" href="menu.html"><i></i><span>NEBRASKA</span></a>
    <span class="nb-spacer"></span>
    <a class="nb-btn" href="menu.html">Ver catálogo</a>
  </div>
</header>

<main class="nb-wrap">
  <h1 class="nb-titulo qr-noprint">Generador de QR</h1>
  <p class="nb-sub qr-noprint">Un QR por producto, listo para imprimir o descargar.</p>

  <div class="qr-panel qr-noprint">
    <div class="qr-fila">
      <div class="qr-campo" style="flex:1 1 100%">
        <label for="base">Dirección del catálogo (a dónde apuntan los QR)</label>
        <input id="base" type="url" spellcheck="false" placeholder="https://usuario.github.io/nebraska/">
      </div>
      <div class="qr-campo">
        <label for="cat">Categoría</label>
        <select id="cat"><option value="">Todas</option></select>
      </div>
      <div class="qr-campo">
        <label for="tam">Tamaño de etiqueta</label>
        <select id="tam">
          <option value="110">Chico (110 px)</option>
          <option value="150" selected>Mediano (150 px)</option>
          <option value="200">Grande (200 px)</option>
        </select>
      </div>
      <div class="qr-campo" style="flex:0 0 auto">
        <button class="nb-btn" id="imprimir" type="button">Imprimir hoja</button>
      </div>
    </div>
    <p class="qr-aviso" id="aviso"></p>
  </div>

  <div class="qr-grid" id="grid"></div>

  <p class="nb-pie qr-noprint">NEBRASKA · Herramienta interna</p>
</main>

<!-- Librería de QR incluida en el repo: el generador funciona sin internet -->
<script src="assets/qrcode.min.js"></script>
<script src="assets/nebraska.js"></script>
<script>
/* =====================================================================
   Genera un QR por producto apuntando a:
     <base>ficha-producto.html?id=CODIGO&cat=CATEGORIA

   La dirección base se detecta sola a partir de la URL de esta página,
   así que si la abrís desde GitHub Pages ya queda bien configurada.
   Se puede editar a mano (queda guardada en este navegador).
   ===================================================================== */
var $base = document.getElementById("base");
var $cat  = document.getElementById("cat");
var $tam  = document.getElementById("tam");
var $grid = document.getElementById("grid");
var $aviso = document.getElementById("aviso");

var LLAVE_BASE = "nb_qr_base";
var datos = null;

/* Carpeta donde vive esta página (sin el nombre del archivo). */
function baseDetectada() {
  return new URL(".", location.href).href;
}

var guardada = localStorage.getItem(LLAVE_BASE);
$base.value = guardada || baseDetectada();

if (location.protocol === "file:") {
  $aviso.innerHTML = "<b>Ojo:</b> abriste el archivo directo desde la carpeta. " +
    "Escribí a mano la dirección pública del catálogo, porque la detectada (file://) " +
    "no sirve para un QR.";
}

NB.manifest().then(function (data) {
  datos = data;
  Object.keys(data.categorias).forEach(function (key) {
    var o = document.createElement("option");
    o.value = key;
    o.textContent = data.categorias[key].nombre;
    $cat.appendChild(o);
  });
  dibujar();
}).catch(function () {
  $grid.innerHTML = '<div class="nb-estado"><strong>No se pudo leer el catálogo</strong>Revisá fichas/manifest.json</div>';
});

function normalizarBase(v) {
  v = (v || "").trim();
  if (v && v.slice(-1) !== "/") v += "/";
  return v;
}

function dibujar() {
  if (!datos) return;
  var base = normalizarBase($base.value);
  var tam = parseInt($tam.value, 10);
  var cats = $cat.value ? [$cat.value] : Object.keys(datos.categorias);

  document.documentElement.style.setProperty("--etiqueta", tam + "px");
  $grid.innerHTML = "";

  var lista = [];
  cats.forEach(function (cat) {
    (datos.categorias[cat].productos || []).forEach(function (codigo) {
      lista.push({ codigo: codigo, cat: cat, nombre: datos.categorias[cat].nombre });
    });
  });

  if (!$cat.value) {
    $aviso.innerHTML = "<b>" + lista.length + " QR</b> — uno por producto del catálogo. " +
      "Cada uno abre la ficha del producto. Verificá que la dirección de arriba sea la pública.";
  } else {
    $aviso.innerHTML = "<b>" + lista.length + " QR</b> de " + NB.escapar(datos.categorias[$cat.value].nombre) + ".";
  }

  /* Se dibuja de a tandas para que el navegador no se trabe con 200+. */
  var i = 0;
  (function tanda() {
    var fin = Math.min(i + 20, lista.length);
    for (; i < fin; i++) armarEtiqueta(lista[i], base, tam);
    if (i < lista.length) requestAnimationFrame(tanda);
  })();
}

function armarEtiqueta(p, base, tam) {
  var url = base + "ficha-producto.html?id=" + encodeURIComponent(p.codigo) + "&cat=" + encodeURIComponent(p.cat);

  var caja = document.createElement("div");
  caja.className = "qr-item";
  var canvas = document.createElement("canvas");
  caja.appendChild(canvas);
  caja.insertAdjacentHTML("beforeend",
    '<div class="cod">' + NB.escapar(p.codigo) + "</div>" +
    '<div class="cat">' + NB.escapar(p.nombre) + "</div>" +
    '<a class="bajar">Descargar PNG</a>');
  $grid.appendChild(caja);

  QRCode.toCanvas(canvas, url, { width: tam * 3, margin: 2, errorCorrectionLevel: "M" }, function (err) {
    if (err) caja.querySelector(".cod").textContent = "Error: " + p.codigo;
  });

  caja.querySelector(".bajar").addEventListener("click", function () {
    var a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = p.codigo + ".png";
    a.click();
  });
}

$base.addEventListener("change", function () {
  localStorage.setItem(LLAVE_BASE, normalizarBase($base.value));
  dibujar();
});
$cat.addEventListener("change", dibujar);
$tam.addEventListener("change", dibujar);
document.getElementById("imprimir").addEventListener("click", function () { window.print(); });
</script>
</body>
</html>
