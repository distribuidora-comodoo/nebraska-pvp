<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d1d1d">
<title>Ficha de producto — Nebraska</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@1,800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
<link rel="stylesheet" href="assets/nebraska.css">
</head>
<body>

<!-- Barra fija: el botón "Ver catálogo" queda siempre arriba, junto al
     buscador por código, para poder saltar a cualquier otro producto. -->
<header class="nb-header">
  <div class="nb-bar">
    <a class="nb-logo" href="menu.html"><i></i><span>NEBRASKA</span></a>
    <span class="nb-spacer"></span>
    <a class="nb-btn" href="menu.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
      Ver catálogo
    </a>
  </div>
  <div class="nb-search">
    <div class="nb-field">
      <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="nb-q" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="Buscar otro producto por código" aria-label="Buscar producto por código">
      <button class="nb-limpiar" type="button" aria-label="Borrar búsqueda">&times;</button>
    </div>
    <div class="nb-res" id="nb-res"></div>
  </div>
</header>

<main class="nb-wrap nb-wrap--angosto">
  <div class="nb-acciones" id="acciones"></div>

  <div class="nb-card" id="card">
    <div class="nb-skel nb-skel-ficha"></div>
  </div>

  <section class="nb-sec" id="relacionados" hidden>
    <div class="nb-sec-head">
      <h2 id="rel-titulo">También te puede interesar</h2>
      <a id="rel-todos" href="menu.html">Ver todos</a>
    </div>
    <div class="nb-carrusel" id="rel-lista"></div>
  </section>

  <div class="nb-cierre">
    <a class="nb-btn nb-btn--ancho" href="menu.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
      Ver todo el catálogo
    </a>
  </div>

  <p class="nb-pie">NEBRASKA · Precios sugeridos de venta</p>
</main>

<script src="assets/nebraska.js"></script>
<script src="assets/compartir.js"></script>
<script>
/* =====================================================================
   Links del QR que soporta esta página:
     ficha-producto.html?id=NECO02024K&cat=compresores
     ficha-producto.html?id=NECO02024K            (sin categoría: la busca
                                                   sola en el manifest)
   Si el código no figura en el manifest, prueba igual en la carpeta base
   fichas/CODIGO.png, así los QR viejos siguen funcionando sin tocarlos.
   ===================================================================== */
var params   = new URLSearchParams(location.search);
var id       = (params.get("id") || "").trim();
var catParam = params.get("cat");

var card     = document.getElementById("card");
var acciones = document.getElementById("acciones");

var ICONO_VOLVER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

function botonVolver(href, texto) {
  acciones.innerHTML =
    '<a class="nb-btn nb-btn--claro nb-btn--flexible" href="' + href + '">' +
    ICONO_VOLVER + NB.escapar(texto) + "</a>";
}

function error(titulo, texto) {
  card.innerHTML =
    '<div class="nb-estado"><strong>' + titulo + "</strong>" + texto +
    '<br><a class="nb-btn" href="menu.html">Ver catálogo completo</a></div>';
}

botonVolver("menu.html", "Volver al catálogo");

if (!id) {
  error("Falta el código en el link", "Buscá el producto por su código arriba.");
} else {
  document.title = id + " — Nebraska";

  NB.manifest()
    .then(function (data) { return data; })
    .catch(function () { return null; })
    .then(function (data) {
      var catManifest = data ? NB.catDe(data, id) : null;

      /* Carpetas donde puede estar la ficha, en orden de prioridad:
         la del link, la del manifest, la carpeta base y, como última
         red de seguridad, el resto de las categorías (así una imagen
         guardada en otra carpeta igual se encuentra). */
      var candidatos = [];
      var orden = [catParam, catManifest, null].concat(data ? Object.keys(data.categorias) : []);
      orden.forEach(function (c) {
        if (candidatos.indexOf(c) < 0) candidatos.push(c);
      });

      probar(0);

      function probar(i) {
        if (i >= candidatos.length) {
          /* Si el código sí figura en el manifest, la ficha todavía no
             está subida: igual lo dejamos volver a su categoría y ver el
             resto de la familia, en vez de dejarlo en un callejón. */
          if (catManifest && data.categorias[catManifest]) {
            var info = data.categorias[catManifest];
            botonVolver("categoria.html?cat=" + encodeURIComponent(catManifest), "Volver a " + info.nombre);
            error("Estamos preparando la ficha de " + NB.escapar(id),
                  "Mientras tanto podés ver el resto de " + NB.escapar(info.nombre) + ".");
            relacionados(catManifest, info);
          } else {
            error('No encontramos el código "' + NB.escapar(id) + '"',
                  "Verificá el código o buscalo arriba.");
          }
          return;
        }
        var cat = candidatos[i];
        var img = new Image();
        img.className = "nb-ficha-img";
        img.alt = "Ficha del producto " + id;
        /* La categoría que se muestra es la del manifest (la comercial),
           aunque la imagen se haya encontrado en otra carpeta. */
        img.onload = function () { mostrar(img, catManifest || catParam, data); };
        img.onerror = function () { probar(i + 1); };
        /* El "?t=" evita que el navegador muestre una versión vieja en
           caché después de reemplazar la imagen en el repo. */
        img.src = NB.imgFicha(id, cat) + "?t=" + Date.now();
      }
    });
}

function mostrar(img, cat, data) {
  var info = cat && data && data.categorias ? data.categorias[cat] : null;

  NB.registrarVisita(cat, id);

  /* Botón de volver a la categoría, arriba de la ficha. */
  if (info) {
    botonVolver("categoria.html?cat=" + encodeURIComponent(cat), "Volver a " + info.nombre);
  }

  /* Encabezado de la tarjeta: código + categoría */
  card.innerHTML = "";
  var top = document.createElement("div");
  top.className = "nb-card-top";
  top.innerHTML =
    '<span class="cod">' + NB.escapar(id) + "</span>" +
    (info ? '<a class="nb-chip" href="categoria.html?cat=' + encodeURIComponent(cat) + '">' + NB.escapar(info.nombre) + "</a>" : "");
  card.appendChild(top);
  card.appendChild(barraCompartir(img));
  card.appendChild(img);

  /* Video del producto, si está cargado en el manifest */
  var videoUrl = data && data.videos ? data.videos[id] : null;
  if (videoUrl) {
    var wrap = document.createElement("div");
    wrap.className = "nb-video";
    wrap.innerHTML = "<h3>Video del producto</h3>" +
      '<iframe src="' + NB.escapar(videoUrl) + '" allow="autoplay" allowfullscreen loading="lazy"></iframe>';
    card.appendChild(wrap);
  }

  if (info) relacionados(cat, info);
}

/* ---------------------------------------------------------------------
   Compartir / Descargar, arriba de la imagen.

   Compartir abre el menú del celular con la foto adjunta; ahí la persona
   elige WhatsApp -> Mi estado, o Instagram -> Historia. Descargar la
   guarda en la galería (en iPhone, abre el mismo menú para tocar
   "Guardar imagen", que es lo único que manda una foto a Fotos).
   --------------------------------------------------------------------- */
var ICONO_COMPARTIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var ICONO_BAJAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M4 20h16"/></svg>';
var ICONO_STORY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/></svg>';
var ICONO_FICHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';

function barraCompartir(img) {
  var C = NBCompartir;
  var barra = document.createElement("div");
  barra.className = "nb-share";
  barra.innerHTML =
    '<div class="nb-share-formato" role="group" aria-label="Formato de la imagen">' +
      '<button type="button" data-f="story">' + ICONO_STORY + "Para story</button>" +
      '<button type="button" data-f="original">' + ICONO_FICHA + "Ficha original</button>" +
    "</div>" +
    '<div class="nb-share-botones">' +
      '<button class="nb-btn" type="button" data-accion="compartir">' + ICONO_COMPARTIR + "Compartir</button>" +
      '<button class="nb-btn nb-btn--claro" type="button" data-accion="guardar">' + ICONO_BAJAR +
        (C.esIOS ? "Guardar en Fotos" : "Descargar") + "</button>" +
    "</div>" +
    '<p class="nb-share-nota"></p>';

  var nota = barra.querySelector(".nb-share-nota");
  var botonesFormato = barra.querySelectorAll(".nb-share-formato button");
  var botonesAccion = barra.querySelectorAll(".nb-share-botones button");

  function pintarFormato() {
    var f = C.formato();
    botonesFormato.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.f === f)); });
    nota.innerHTML = f === "story"
      ? "Lista para subir como <b>estado</b> o <b>story</b>: no se corta el precio."
      : "La ficha tal cual, para mandar por chat.";
  }
  pintarFormato();

  botonesFormato.forEach(function (b) {
    b.addEventListener("click", function () { C.guardarFormato(b.dataset.f); pintarFormato(); });
  });

  /* Se arma la versión para story apenas se ve la ficha, así el toque
     en Compartir no tiene que esperar (importa en iPhone). */
  var listo = C.preparar(img, id);
  listo.catch(function () { nota.textContent = "No se pudo preparar la imagen para compartir."; });

  function ocupado(si) { botonesAccion.forEach(function (b) { b.disabled = si; }); }

  botonesAccion.forEach(function (b) {
    b.addEventListener("click", function () {
      ocupado(true);
      listo.then(function (archivos) {
        var archivo = archivos[C.formato()];
        var accion = b.dataset.accion === "compartir" ? C.compartir : C.guardar;
        return accion([archivo], id);
      }).then(function (resultado) {
        if (resultado === "descargado") {
          nota.innerHTML = C.esIOS
            ? "Si no apareció el menú, mantené apretada la imagen y elegí <b>Guardar imagen</b>."
            : "Guardada en <b>Descargas</b>. Ya la podés subir desde la galería.";
        } else if (resultado === "compartido") {
          pintarFormato();
        }
      }).catch(function () {
        nota.textContent = "No se pudo compartir. Probá de nuevo.";
      }).then(function () { ocupado(false); });
    });
  });

  return barra;
}

/* Carrusel con el resto de la familia, para seguir recorriendo el catálogo. */
function relacionados(cat, info) {
  var todos = info.productos || [];
  var desde = todos.indexOf(id);
  var lista = [];
  for (var i = 1; i < todos.length && lista.length < 12; i++) {
    lista.push(todos[(Math.max(desde, 0) + i) % todos.length]);
  }
  if (!lista.length) return;

  var cont = document.getElementById("rel-lista");
  lista.forEach(function (codigo) { cont.appendChild(NB.tarjeta(codigo, cat)); });

  document.getElementById("rel-titulo").textContent = "Más en " + info.nombre;
  document.getElementById("rel-todos").href = "categoria.html?cat=" + encodeURIComponent(cat);
  document.getElementById("relacionados").hidden = false;
}
</script>

</body>
</html>
